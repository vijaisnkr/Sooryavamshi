# Supabase's free plan pauses a project after 7 days without activity, and a
# paused project silently drops website enquiries. This asks the database a
# small question twice a week so it never goes quiet that long. If Supabase
# doesn't answer, the run fails and GitHub emails the repository owner.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * 1,4"   # Monday and Thursday, 03:17 UTC (08:47 IST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the enquiries table with the site's public key
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            "https://dtbruomlpuxwgpvdosoz.supabase.co/rest/v1/site_assessment_requests?select=id&limit=1" \
            -H "apikey: sb_publishable_mxMYpObR0l_Sl5UKK2a8IA_FSSHCFXu")
          echo "Supabase answered HTTP $status"
          test "$status" = "200"
